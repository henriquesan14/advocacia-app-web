<form nz-form [formGroup]="form" nzLayout="vertical" (ngSubmit)="salvar()">
  <nz-form-item>
    <nz-form-label nzRequired>Nova situação</nz-form-label>
    <nz-form-control nzErrorTip="Selecione uma situação">
      <nz-select formControlName="situacaoProcessoId" nzPlaceHolder="Selecione" [nzLoading]="loading">
        @for (situacao of situacoes; track situacao.id) {
          <nz-option [nzValue]="situacao.id" [nzLabel]="situacao.descricao"></nz-option>
        }
      </nz-select>
    </nz-form-control>
  </nz-form-item>

  <div class="d-flex justify-content-end gap-2 mt-3">
    <button class="me-1" nz-button type="button" (click)="cancelar()" [disabled]="saving">Cancelar</button>
    <button nz-button nzType="primary" type="submit" [nzLoading]="saving"
      [disabled]="form.invalid || loading || saving">
      Atualizar
    </button>
  </div>
</form>
